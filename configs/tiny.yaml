# tinygpt "tiny" run: trains on an Apple M3 CPU in a few minutes.
# The README "Results" table was produced with exactly this file.
model:
  vocab_size: 512        # must equal the `tinygpt prepare --vocab-size` used for data/
  block_size: 128
  n_layer: 4
  n_head: 4
  n_embd: 128
  dropout: 0.0
  bias: false
  sdpa: true
train:
  data_dir: data
  out_dir: out/tiny
  device: cpu            # cpu | mps | auto. README numbers are CPU; `--device mps` overrides.
  seed: 1337
  batch_size: 32
  max_steps: 3000
  lr: 1.0e-3
  min_lr: 1.0e-4
  warmup_steps: 100
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_interval: 100
  eval_iters: 10
  log_interval: 50
